name: Daily Lead Hunter

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST is 02:30 UTC
  workflow_dispatch:

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
          
      - name: Run Lead Hunter
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }} # If using remote Ollama or switch to Groq
          USE_GROQ: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json
          python scripts/run_daily.py --live
