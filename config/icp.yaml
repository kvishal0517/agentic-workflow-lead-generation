agency:
  name: "AI Automation Agency"
  description: "B2B Agency selling website development and AI automation solutions."
  target_audience: "Small to mid-sized businesses looking to optimize operations."

icp:
  industries: ["Healthcare", "EdTech", "Legal", "Fitness"]
  company_size: "10-200 employees"
  geographies: ["India", "UAE", "Singapore"]
  roles: ["Founder", "CEO", "Marketing Head", "CTO"]
  signals:
    - "hiring web developers"
    - "no website / outdated website"
    - "recently funded"
    - "expanding online presence"
  keywords: ["digital transformation", "online presence", "website revamp"]
  exclude:
    - "agency"
    - "freelancer"
    - "competitor"

your_offer:
  service: "Tailored portfolios, websites, and AI automation agents"
  value_prop: "Launch a premium website in 2 weeks with built-in automation"
  proof: "Built sites for IIT-style programs, doctors, lawyers, gyms"